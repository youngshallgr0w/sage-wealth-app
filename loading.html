<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>

<style>
:root{
    --primary:#C0392B;
    --bg:#0A0F17;
    --text:#FFFFFF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, "Segoe UI", Arial, sans-serif;
}

body{
    background:var(--bg);
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.loader{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.dots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
}

.dot{
    width:12px;
    height:12px;
    background:var(--primary);
    border-radius:50%;
    animation:bounce 1.4s infinite ease-in-out;
}

.dot:nth-child(2){
    animation-delay:0.2s;
}

.dot:nth-child(3){
    animation-delay:0.4s;
}

.text{
    color:var(--text);
    font-size:16px;
    font-weight:500;
    line-height:1.5;
    max-width:280px;
}

@keyframes bounce{

    0%, 80%, 100%{
        transform:scale(0.6);
        opacity:0.4;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }

}

@media(max-width:480px){

    .dot{
        width:10px;
        height:10px;
    }

    .text{
        font-size:14px;
        max-width:240px;
    }

}
</style>
</head>
<body>

<div class="loader">

    <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <p class="text" id="loaderText">
        Processing...
    </p>

</div>

<script>

// Reusable loading screen — pass the destination (and optionally a custom
// message) via URL params, e.g. loading.html?to=withdraw.html&text=Preparing%20your%20withdrawal...
const params = new URLSearchParams(window.location.search);
const destination = params.get('to') || 'main.html';
const message = params.get('text');

if (message) {
    document.getElementById('loaderText').textContent = message;
}

setTimeout(function () {
    // replace() so this loading screen never becomes its own entry in
    // browser history — otherwise pressing Back would land here and its
    // timer would just fire again, forwarding right back to the same page.
    window.location.replace(destination);
}, 3000);

</script>

</body>
</html>
