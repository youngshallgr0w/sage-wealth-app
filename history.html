<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Sage Wealth — History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="history.css"/>
</head>
<body class="sw-loading">
<div id="swGate" class="sw-gate"></div>
<style>
  body.sw-loading > *:not(#swGate) { visibility: hidden; }
  .sw-gate { position: fixed; inset: 0; z-index: 9999; background: #0e0e0e; }
</style>

  <div class="app">

    <!-- ── TOP BAR ── -->
    <header class="h-topbar">
      <a href="main.html" class="h-back">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h1 class="h-title">Transaction History</h1>
      <div class="h-spacer"></div>
    </header>

    <!-- ── BALANCE STRIP ── -->
    <div class="bal-strip">
      <div class="bal-left">
        <div class="bal-coin-badge">
          <span class="btc-sym">₿</span>
          <span class="btc-label">BTC</span>
        </div>
        <div class="bal-info">
          <span class="bal-label">Portfolio Balance</span>
          <span class="bal-value" id="histBalance">$0.00</span>
        </div>
      </div>
      <div class="bal-tag">
        <i class="fa-solid fa-arrow-trend-up"></i>
        Active
      </div>
    </div>

    <!-- ── FILTER TABS ── -->
    <div class="filter-row">
      <button class="ftab active" data-filter="all">All</button>
      <button class="ftab" data-filter="deposit">Deposits</button>
      <button class="ftab" data-filter="withdraw">Withdrawals</button>
      <button class="ftab" data-filter="gain">Returns</button>
    </div>

    <!-- ── TRANSACTION LIST ── -->
    <div class="tx-scroll" id="txScroll">

      <!-- JS renders all items here -->
      <div class="tx-list" id="txList"></div>

      <div class="tx-empty hidden" id="txEmpty">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <p>No transactions found</p>
      </div>

    </div>

    <!-- ── BOTTOM NAV ── -->
    <nav class="bottom-nav">
      <a href="main.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <button class="nav-item active">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History</span>
      </button>
      <a href="add.html" class="nav-item nav-center">
        <span class="nav-center-icon"><i class="fa-solid fa-plus"></i></span>
      </a>
      <a href="dashboard.html" class="nav-item">
        <i class="fa-solid fa-wallet"></i>
        <span>Dashboard</span>
      </a>
      <a href="more.html" class="nav-item">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </a>
    </nav>

  </div>

  <script type="module">
    import { requireSession, getCachedBalance, setBalance, getNotifications, pushNotification, getCurrentProfile, logoutAccount } from './session.js';
    window.sw = { getCachedBalance, setBalance, getNotifications, pushNotification, getCurrentProfile, logoutAccount };
    requireSession().then(({ uid, profile }) => {
      window.sw.uid = uid;
      window.sw.profile = profile;
      document.dispatchEvent(new CustomEvent('sw:ready', { detail: { uid, profile } }));
      document.body.classList.remove('sw-loading');
      const swGate = document.getElementById('swGate');
      if (swGate) swGate.remove();
    });
  </script>
  <script src="history.js"></script>
</body>
</html>
